<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b3122a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Member Club</title>
<script src="config.js"></script>
<script src="lib/qrcode.js"></script>
<style>
:root{--red:#b3122a;--red2:#d8344a;--bg:#f4f4f6;--text:#222;--muted:#8a8a90;--line:#ececf0;--ok:#1f9d55}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);padding-bottom:calc(84px + env(safe-area-inset-bottom));font-size:15px}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;background:#fff;color:var(--text)}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 18px 6px}
.brand{font-weight:800;font-size:21px;color:var(--red);letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.brand img{width:28px;height:28px;border-radius:8px}
.title{font-size:20px;font-weight:700}
.demo{font-size:11px;background:#fff1c2;color:#7a5a00;padding:3px 8px;border-radius:20px}
.ico{width:22px;height:22px;display:block}
/* 会员卡 */
.mcard{margin:10px 16px;border-radius:20px;padding:18px 18px 0;color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(circle at 85% 20%,#c9a24f55,transparent 45%),linear-gradient(135deg,#2a1e13 0%,#55401f 55%,#a8833a 100%);box-shadow:0 10px 24px rgba(60,40,10,.25)}
.mcard .row{display:flex;gap:14px;align-items:center}
.avatar{width:64px;height:64px;flex:none;border-radius:50%;background:#ffffff2e;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;overflow:hidden;border:2px solid #fff7}
.avatar img{width:100%;height:100%;object-fit:cover}
.name{font-size:21px;font-weight:700}
.sub{opacity:.82;font-size:13px}
.meta{margin-top:14px;font-size:14px;line-height:1.8;padding-right:100px}
.qr{position:absolute;right:16px;bottom:56px;background:#fff;padding:6px;border-radius:10px;width:86px;height:86px;border:0}
.qr svg{width:100%;height:100%;display:block}
.badge{position:absolute;right:16px;top:14px;background:var(--ok);border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:700}
.joined{margin:14px -18px 0;padding:11px;text-align:center;background:#0000002e;font-weight:700;font-size:14px}
/* 快捷 */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 12px}
.gi{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:13px;background:none;border:0;color:var(--text);padding:0}
.gi .ic{width:54px;height:54px;border-radius:50%;background:linear-gradient(145deg,var(--red2),var(--red));display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 5px 12px #b3122a40}
.gi.soon{color:var(--muted)}.gi.soon .ic{background:#efc3c9;box-shadow:none}
.pts{margin:0 16px;border-radius:16px;padding:18px 20px;color:#fff;background:linear-gradient(120deg,#9c0f24,var(--red2));display:flex;justify-content:space-between;align-items:center;border:0;width:calc(100% - 32px);text-align:left}
.big{font-size:26px;font-weight:800;margin-top:2px}
.pts .ico{width:40px;height:40px;color:#ffd968}
h3.sec{margin:22px 18px 10px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
h3.sec a{font-size:13px;color:var(--red);font-weight:500;text-decoration:none}
/* 列表 */
.list{margin:0 16px;display:flex;flex-direction:column;gap:10px}
.act{background:#fff;border-radius:14px;padding:14px;display:flex;gap:12px;align-items:flex-start}
.dt{flex:none;width:52px;text-align:center;background:#fdf0f2;color:var(--red);border-radius:10px;padding:6px 0}
.dt .d{font-size:21px;font-weight:800;line-height:1.1}.dt .mth{font-size:11px}
.ai{flex:1;min-width:0}
.at{font-weight:700;margin-bottom:4px}
.am{font-size:13px;color:var(--muted);line-height:1.6}
.desc{font-size:13px;margin-top:6px;color:#555;white-space:pre-wrap}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:#eee;color:#666;font-weight:500;vertical-align:middle;margin-left:4px}
.tag.ok{background:#e3f6ea;color:var(--ok)}.tag.warn{background:#fff1c2;color:#7a5a00}.tag.bad{background:#fde3e6;color:var(--red)}
.btn{background:var(--red);color:#fff;border:0;border-radius:22px;padding:9px 18px;font-weight:600}
.btn.ghost{background:#fff;color:var(--red);border:1px solid var(--red)}
.btn.block{display:block;width:100%;padding:14px;font-size:16px;border-radius:12px}
.btn:disabled{opacity:.45}
.empty{text-align:center;color:var(--muted);padding:50px 0}
.empty .ico{width:56px;height:56px;margin:0 auto 10px;opacity:.35}
.loader{width:28px;height:28px;border:3px solid #eee;border-top-color:var(--red);border-radius:50%;margin:30px auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.seg{display:flex;margin:8px 16px 14px;background:#fff;border:1px solid #f0c9cf;border-radius:14px;padding:4px}
.seg button{flex:1;border:0;background:none;padding:10px 4px;border-radius:10px;color:var(--red);font-weight:600;font-size:14px}
.seg button.on{background:var(--red);color:#fff;box-shadow:0 3px 8px #b3122a40}
/* 设置 */
.group{background:#fff;border-radius:14px;margin:12px 16px;overflow:hidden}
.group h4{margin:0;padding:14px 16px 4px;font-size:15px}
.item{display:flex;align-items:center;gap:12px;padding:15px 16px;border:0;background:none;width:100%;text-align:left;border-bottom:1px solid var(--line);color:var(--text)}
.item:last-child{border-bottom:0}
.item .ico{color:var(--red)}
.item .r{margin-left:auto;color:var(--muted);font-size:13px;display:flex;align-items:center;gap:4px}
.item .chev{color:var(--red2)}
/* 打卡 */
.punch{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 16px}
.pbtn{border:0;border-radius:18px;padding:20px 10px;color:#fff;font-weight:700;font-size:17px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 6px 14px #0002}
.pbtn .ico{width:30px;height:30px}
.pbtn.in{background:linear-gradient(140deg,#25a35e,#167a43)}
.pbtn.out{background:linear-gradient(140deg,#4d6bd6,#2c47a8)}
.pbtn.visit{grid-column:span 2;background:linear-gradient(140deg,var(--red2),var(--red));flex-direction:row;justify-content:center}
.clock{text-align:center;margin:6px 0 16px}
.clock .tm{font-size:40px;font-weight:800;letter-spacing:1px}
.clock .sub{color:var(--muted);opacity:1}
.rec{background:#fff;border-radius:12px;padding:12px 14px;font-size:13px}
.rec b{font-size:14px}
.rec a{color:var(--red)}
.map{width:100%;height:220px;border:0;border-radius:12px;background:#eee;margin-top:6px}
.gpsinfo{font-size:13px;color:var(--muted);margin:8px 0}
/* 底部导航 */
nav#tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;border:0;background:none;padding:9px 0 10px;font-size:12px;color:#9a9aa0;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--red)}
nav .mid{position:relative}
nav .mid .fab{width:62px;height:62px;border-radius:50%;background:linear-gradient(145deg,var(--red2),var(--red));color:#fff;display:flex;align-items:center;justify-content:center;margin-top:-30px;box-shadow:0 6px 16px #b3122a66;border:4px solid #fff}
nav .mid .fab .ico{width:28px;height:28px}
/* 弹窗 */
.mask{position:fixed;inset:0;background:#0006;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom))}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sheet .hd b{font-size:18px}
.x{border:0;background:#e8e8ec;width:32px;height:32px;border-radius:50%;font-size:18px;color:#555;flex:none}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#222e;color:#fff;padding:11px 18px;border-radius:24px;font-size:14px;z-index:30;opacity:0;transition:.25s;pointer-events:none;max-width:86%;text-align:center}
#toast.show{opacity:1}
.install{margin:8px 16px;background:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;border:1px dashed var(--red2)}
.install .ico{color:var(--red);flex:none}
.install .t{flex:1;font-size:14px}
.install .x{width:26px;height:26px;font-size:14px}
/* 登录 */
.login{max-width:420px;margin:0 auto;padding:calc(50px + env(safe-area-inset-top)) 24px 20px}
.login .logo{width:84px;height:84px;border-radius:22px;display:block;margin:0 auto 14px;box-shadow:0 8px 20px #b3122a40}
.login h1{text-align:center;margin:0 0 4px;color:var(--red)}
.login p.c{text-align:center;color:var(--muted);margin:0 0 20px}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}
.qrbig{background:#fff;border-radius:16px;padding:20px;text-align:center}
.qrbig svg{width:240px;height:240px}
</style>
</head>

'use strict';
const C = window.APP_CONFIG || {};
const DEMO = !C.API_URL;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }

/* ---------- 文字（中 / 英） ---------- */
const I18N = {

    org:'Members', shop:'Shop', donate:'Donate', honor:'Honours', soon:'Coming soon', upcoming:'Upcoming', more:'All',

    quota:'Seats', place:'Venue', account:'Account', bio:'Profile', changePw:'Change password', prefs:'Preferences', language:'Language', feedback:'Feedback',

const S = { token: ls('tk'), me: null, tab: 'home', sub: 'all', lang: ls('lang') || C.LANG || 'zh', today: [] };
const t = k => (I18N[S.lang] || I18N.zh)[k] || I18N.zh[k] || k;
function errMsg(e) {
  const code = String((e && e.message) || e);
  if (code.indexOf('TOO_FAR:') === 0) return t('err_TOO_FAR').replace('{d}', code.split(':')[1]);
  return I18N[S.lang]['err_' + code] ? t('err_' + code) : code;
}

/* ---------- 图标 ---------- */
const sv = p => `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICON = {
  home: sv('<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>'),
  cal: sv('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'),
  star: sv('<path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/>'),
  user: sv('<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/>'),
  people: sv('<circle cx="9" cy="8" r="3.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M2 20c.8-3.5 3.6-5 7-5s6.2 1.5 7 5M16 14.6c2.8 0 5 1.3 6 4.4"/>'),
  cart: sv('<path d="M3 4h2l2.4 11h11l2-8H6.2"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/>'),
  heart: sv('<path d="M12 20s-7-4.4-9-9a4.8 4.8 0 0 1 9-3 4.8 4.8 0 0 1 9 3c-2 4.6-9 9-9 9z"/>'),

  pin: sv('<path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/>'),

  shield: sv('<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>'),
  out: sv('<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/>'),
  dl: sv('<path d="M12 3v12M7 10l5 5 5-5M4 20h16"/>'),
  clockIn: sv('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
  logout2: sv('<path d="M9 4H5v16h4M14 8l4 4-4 4M18 12H8"/>'),
  empty: sv('<path d="M4 13l3-8h10l3 8v6H4z"/><path d="M4 13h5l1 2h4l1-2h5"/>'),
};
const chev = '<span class="chev">›</span>';

/* ---------- API ---------- */
async function api(action, data) {
  data = data || {};
  if (DEMO) return demoApi(action, data);
  let r;
  try {
    r = await fetch(C.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action, token: S.token }, data)) });
  } catch (e) { throw new Error('NETWORK'); }
  const j = await r.json().catch(() => ({ ok: false, error: 'NETWORK' }));
  if (!j.ok) { if (j.error === 'AUTH' && action !== 'login') { doLogout(true); } throw new Error(j.error); }
  return j.data;
}

/* ---------- 定位 ---------- */
function getLoc() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('NO_GPS'));
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6), acc: Math.round(p.coords.accuracy) }),
      e => rej(new Error(e.code === 1 ? 'GPS_DENIED' : 'GPS_FAIL')),
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  });
}
function mapFrame(loc) {
  const d = 0.004;
  const bbox = [loc.lng - d, loc.lat - d * 0.7, loc.lng + d, loc.lat + d * 0.7].join(',');
  return `<iframe class="map" loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${loc.lat},${loc.lng}"></iframe>`;
}

/* ---------- 安装 (PWA) ---------- */
let deferredPrompt = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; refreshInstall(); });
window.addEventListener('appinstalled', () => { deferredPrompt = null; toast(t('done')); refreshInstall(); });
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
function installBanner() {
  if (isStandalone() || ls('hideInstall')) return '<div id="inst"></div>';
  if (!deferredPrompt && !isIOS) return '<div id="inst"></div>';
  return `<div id="inst"><div class="install">${ICON.dl}<div class="t"><b>${t('install')}</b><div class="sub" style="color:var(--muted)">${isIOS ? t('iosTip') : t('installTip')}</div></div>
    ${deferredPrompt ? `<button class="btn" data-act="install">${t('installBtn')}</button>` : ''}<button class="x" data-act="hideInstall">×</button></div></div>`;
}
function refreshInstall() { const el = $('#inst'); if (el) el.outerHTML = installBanner(); }
async function doInstall() {
  if (deferredPrompt) { deferredPrompt.prompt(); await deferredPrompt.userChoice.catch(() => {}); deferredPrompt = null; refreshInstall(); }
  else openSheet(t('install'), `<p>${isIOS ? t('iosTip') : t('otherTip')}</p>`);
}

/* ---------- 小工具 ---------- */
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 2600); }
const dmy = s => { const p = String(s || '').split('-'); return p.length === 3 ? `${p[2]}-${p[1]}-${p[0]}` : s; };
const MON = { zh: ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'], en: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'] };
function qrSvg(text) { const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); }
const loader = '<div class="loader"></div>';
const empty = () => `<div class="empty">${ICON.empty}${t('noData')}</div>`;
function localDate(d) { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

function openSheet(title, html, mount) {
  closeSheet();
  const m = document.createElement('div');
  m.className = 'mask'; m.id = 'mask';
  m.innerHTML = `<div class="sheet"><div class="hd"><b>${esc(title)}</b><button class="x" data-act="close">×</button></div><div id="sheetBody">${html}</div></div>`;
  m.addEventListener('click', e => { if (e.target === m) closeSheet(); });
  document.body.appendChild(m);
  if (mount) mount($('#sheetBody'));
}
function closeSheet() { const m = $('#mask'); if (m) m.remove(); }

function actCard(a, mode) {
  const p = String(a.date).split('-');
  const full = a.quota && a.count >= a.quota;
  let tag = '', btns = '';
  if (mode === 'hosted') tag = `<span class="tag ${a.status === '开放' ? 'ok' : a.status === '待审核' ? 'warn' : ''}">${esc({ '开放': t('open'), '关闭': t('closed'), '待审核': t('pending') }[a.status] || a.status)}</span>`;
  else if (a.attended) tag = `<span class="tag ok">${t('attended')}</span>`;
  else if (a.registered) tag = `<span class="tag ok">${t('registered')}</span>`;
  if ((mode === 'all' || mode === 'mine') && !a.attended) {
    btns = a.registered ? `<button class="btn ghost" data-cancel="${esc(a.id)}">${t('cancel')}</button>`
      : full ? `<button class="btn" disabled>${t('full')}</button>` : `<button class="btn" data-reg="${esc(a.id)}">${t('register')}</button>`;
    if (a.date === localDate() && !a.attended) btns += `<button class="btn ghost" data-checkin="${esc(a.id)}">📍 ${t('checkInNow')}</button>`;
  }
  return `<div class="act"><div class="dt"><div class="d">${esc(p[2] || '')}</div><div class="mth">${esc(MON[S.lang][(+p[1] || 1) - 1])}</div></div>
    <div class="ai"><div class="at">${esc(a.title)}${tag}</div>
    <div class="am">🕒 ${esc(a.time || '-')}${a.location ? ' · 📍 ' + esc(a.location) : ''}</div>
    <div class="am">${t('quota')}: ${a.count}${a.quota ? ' / ' + a.quota : ''}${a.points ? ` · ⭐ ${a.points} pts` : ''}</div>
    ${a.desc ? `<div class="desc">${esc(a.desc)}</div>` : ''}
    ${btns ? `<div class="acts">${btns}</div>` : ''}</div></div>`;
}

function formSheet(title, fields, onSubmit) {

const ACTIONS = {
  close: closeSheet,
  install: doInstall,
  hideInstall: () => { ls('hideInstall', '1'); refreshInstall(); },
  soon: () => toast(t('soon')),
  goPoints: () => { S.tab = 'points'; render(); },
  lang: () => { S.lang = S.lang === 'zh' ? 'en' : 'zh'; ls('lang', S.lang); render(); },
  qr: () => openSheet('QR', `<div class="qrbig">${qrSvg('MEMBER:' + S.me.id)}<p><b>${esc(S.me.name)}</b> · ID ${esc(S.me.id)}</p><p class="sub" style="color:var(--muted)">${t('showQR')}</p></div>`),

    api('org').then(r => { const b = $('#sheetBody'); if (b) b.innerHTML = `<p><b>${esc(r.branch)}</b> · ${r.members.length} ${t('membersN')}</p>
      <div class="group" style="margin:0">${r.members.map(x => `<div class="item">${ICON.user}<span>${esc(x.name)}</span><span class="r">${esc(x.level)}</span></div>`).join('')}</div>`; })
      .catch(e => { const b = $('#sheetBody'); if (b) b.innerHTML = `<div class="err">${esc(errMsg(e))}</div>`; });
  },
  bio: () => formSheet(t('bio'), `<textarea name="bio" maxlength="1000">${esc(S.me.bio)}</textarea>`, async f => {
    await api('updateBio', { bio: f.bio.value }); S.me.bio = f.bio.value; closeSheet(); toast(t('saved'));
  }),
  pw: () => formSheet(t('changePw'), `<label>${t('oldPw')}</label><input type="password" name="o" required><label>${t('newPw')}</label><input type="password" name="n" minlength="6" required>`, async f => {
    await api('changePassword', { oldPw: f.o.value, newPw: f.n.value }); closeSheet(); toast(t('saved'));
  }),
  feedback: () => formSheet(t('feedback'), `<textarea name="tx" placeholder="${esc(t('fbPh'))}" required></textarea>`, async f => {
    await api('feedback', { text: f.tx.value }); closeSheet(); toast(t('done'));
  }),
  privacy: () => { openSheet(t('privacy'), loader); api('privacy').then(x => { const b = $('#sheetBody'); if (b) b.innerHTML = `<p style="white-space:pre-wrap;line-height:1.7">${esc(x)}</p>`; }); },
  logout: () => { if (confirm(t('confirmLogout'))) doLogout(); },

    formSheet(t('newEvent').replace('+ ', ''), `<label>${t('title')} *</label><input name="title" required>
      <label>${t('date')} *</label><input type="date" name="date" min="${localDate()}" required><label>${t('time')}</label><input type="time" name="time">
      <label>${t('place')}</label><input name="location"><button type="button" class="btn ghost" id="useLoc" style="margin-top:8px">📍 ${t('useMyLoc')}</button><div class="gpsinfo" id="locInfo"></div>
      <label>${t('quota')}</label><input type="number" name="quota" min="0" inputmode="numeric"><label>${t('desc')}</label><textarea name="desc"></textarea>`,
      async f => {
        await api('hostActivity', { title: f.title.value, date: f.date.value, time: f.time.value, location: f.location.value, quota: f.quota.value, desc: f.desc.value, loc: evLoc });
        closeSheet(); toast(t('submitted')); render();
      });
    $('#useLoc').onclick = async () => {
      $('#locInfo').textContent = t('locating');
      try { evLoc = await getLoc(); $('#locInfo').textContent = `✅ ${t('locSet')} (${evLoc.lat}, ${evLoc.lng} ±${evLoc.acc}${t('meters')})`; }
      catch (e) { $('#locInfo').textContent = errMsg(e); }
    };
  },
};

function doLogout(silent) {
  if (!silent && S.token) api('logout').catch(() => {});
  S.token = null; S.me = null; ls('tk', null); closeSheet(); render();
  if (silent) toast(t('err_AUTH'));
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-tab],[data-act],[data-sub],[data-reg],[data-cancel],[data-checkin],[data-punch]');
  if (!el) return;
  if (el.tagName === 'A') e.preventDefault();
  const d = el.dataset;
  if (d.tab) { closeSheet(); S.tab = d.tab; render(); }
  else if (d.sub) { S.sub = d.sub; eventsView(); }
  else if (d.act && ACTIONS[d.act]) ACTIONS[d.act]();
  else if (d.punch) startPunch(d.punch);
  else if (d.checkin) eventCheckIn(d.checkin);
  else if (d.reg || d.cancel) {
    el.disabled = true;
    try { await api(d.reg ? 'register' : 'cancel', { activityId: d.reg || d.cancel }); toast(t('done')); render(); }
    catch (err) { toast(errMsg(err)); el.disabled = false; }
  }
});

    ],

  };

function demoApi(action, d) {
  return new Promise((res, rej) => setTimeout(() => {
    try {
      const td = localDate();
      switch (action) {
        case 'login': if (d.password !== '123456') throw 'LOGIN_FAILED'; return res({ token: 'demo', profile: DM.me });
        case 'me': return res(DM.me);
        case 'activities': {
          const m = d.mode;
          return res(DM.acts.filter(a => m === 'mine' ? a.registered && a.date >= td : m === 'hosted' ? a.hostId === DM.me.id : m === 'history' ? a.registered && a.date < td : a.status === '开放' && a.date >= td));
        }
        case 'register': { const a = DM.acts.find(x => x.id === d.activityId); if (a.quota && a.count >= a.quota) throw 'FULL'; a.registered = true; a.count++; return res(true); }
        case 'cancel': { const a = DM.acts.find(x => x.id === d.activityId); a.registered = false; a.count--; return res(true); }
        case 'eventCheckIn': { const a = DM.acts.find(x => x.id === d.activityId); if (!a.registered) { a.registered = true; a.count++; } a.attended = true; DM.log.unshift({ time: td, delta: a.points, reason: 'Attended: ' + a.title }); return res({ distance: 12, points: a.points }); }
        case 'checkIn': {
          const ty = { in: '到达', out: '离开', visit: '地点' }[d.type]; const time = td + ' ' + new Date().toTimeString().slice(0, 5);
          DM.recs.unshift({ time, type: ty, address: 'Demo · ' + d.loc.lat + ', ' + d.loc.lng, place: d.place, map: `https://maps.google.com/?q=${d.loc.lat},${d.loc.lng}`, inRange: ty === '拜访' ? '' : '是' });
          return res({ type: ty, time, inRange: true });
        }
        case 'myCheckIns': return res(DM.recs);
        case 'pointsLog': return res(DM.log);
        case 'org': return res({ branch: DM.me.branch, members: [{ name: 'Tan Wei Ming', level: 'Branch Committee' }, { name: 'Lim Mei Ling', level: 'Member' }, { name: 'Ahmad Faizal', level: 'Member' }] });
        case 'hostActivity': DM.acts.push({ id: 'N' + Date.now(), title: d.title, date: d.date, time: d.time, location: d.location, desc: d.desc, quota: +d.quota || 0, count: 0, points: 0, registered: false, attended: false, status: '待审核', hostId: DM.me.id }); return res(true);
        case 'privacy': return res('(Demo) We only collect your member details, event records, and your location at the moment you check in.');
        default: return res(true);
      }
    } catch (e) { rej(new Error(e)); }
  }, 250));
}

})();
